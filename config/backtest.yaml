# Пример конфига бэктеста (этап 3).
# Все даты — UTC, формат YYYY-MM-DD.

# Торговая пара (формат ccxt) и таймфрейм свечей.
symbol: BTC/USDT
timeframe: 4h

# Период бэктеста: start включительно, end не включительно.
# end: null — до последних доступных данных.
start: "2022-01-01"
end: null

# Издержки исполнения:
#   fee_rate — комиссия taker за сторону сделки (0.001 = 0.1%);
#   slippage_bps — проскальзывание в базисных пунктах (5 bps = 0.05%).
fee_rate: 0.001
slippage_bps: 5.0

# Доля капитала, выделяемая под позицию (0.95 = 95% equity).
position_size_pct: 0.95

# Стратегия (плагин) и её параметры: пересечение SMA(20) и SMA(50).
strategy: sma_cross
strategy_params:
  fast_period: 20
  slow_period: 50
