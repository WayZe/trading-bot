# Конфиг бэктеста.
# Все даты — UTC, формат YYYY-MM-DD.

# Торговая пара (формат ccxt) и таймфрейм свечей.
symbol: BTC/USDT
timeframe: 4h

# Период бэктеста: start включительно, end не включается.
# end: null — до последних доступных данных.
start: "2025-08-01"
end: null

# Капитал и размер позиции:
#   start_cash — стартовый кэш в котируемой валюте (USDT);
#   position_size_pct — доля капитала под позицию (0.95 = 95% equity);
#   min_notional — минимальный объём ордера в USDT, меньше — сделка не проходит;
#   quantity_precision — до скольки знаков округляется количество (вниз).
start_cash: 10000.0
position_size_pct: 0.95
min_notional: 5.0
quantity_precision: 6

# Издержки исполнения:
#   fee_rate — комиссия taker за сторону сделки (0.001 = 0.1%);
#   slippage_bps — проскальзывание в базисных пунктах (5 bps = 0.05%).
fee_rate: 0.001
slippage_bps: 5.0

# Стратегия (плагин) и её параметры:
#   fast/slow — периоды быстрой и медленной SMA (вход/выход по кроссу);
#   atr_period — период ATR для стопа;
#   atr_mult — множитель ATR: дистанция стопа от close сигнальной свечи
#     (close - atr_mult * ATR); движок переносит её на фактическую цену
#     исполнения и проверяет интрабарно.
strategy: sma_cross
strategy_params:
  fast: 20
  slow: 50
  atr_period: 14
  atr_mult: 2.0
