# Конфиг исследовательских прогонов (sweep/walkforward), вариант sma_cross_trend:
# SmaCrossStrategy внутри тренд-фильтра TrendFiltered.
# Пара и таймфрейм переопределяются флагами --symbol/--timeframe CLI.
# Все даты — UTC, формат YYYY-MM-DD.

symbol: BTC/USDT
timeframe: 4h

# Полная исследовательская история (совпадает с диапазоном датасетов).
start: "2023-01-01"
end: null

start_cash: 10000.0
position_size_pct: 0.95
min_notional: 5.0
quantity_precision: 6

fee_rate: 0.001
slippage_bps: 5.0

strategy: sma_cross_trend
# atr_period фиксирован (не участвует в сетках); fast/slow/atr_mult/trend_period
# перекрываются --param.
strategy_params:
  fast: 20
  slow: 50
  atr_period: 14
  atr_mult: 2.0
  trend_period: 200
